[project]
name = "qtrader"
version = "0.1.0"
description = "국내·미국 주식 퀀트 자동매매 (한국투자증권 Open API)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "keyring>=24",
  "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qtrader = "qtrader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qtrader*"]

[tool.setuptools.package-data]
qtrader = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
