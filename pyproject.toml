[project]
name = "qtrader"
version = "0.1.0"
description = "국내·미국 주식 AI 퀀트 자동매매 (토스증권·한국투자증권 Open API)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "keyring>=24",
  "anthropic>=2.3",
  "defusedxml>=0.7",
  "pywebview>=5.4; sys_platform == 'win32'",  # 프로그램 창 (윈도우 Edge WebView2)
  "pystray>=0.19; sys_platform == 'win32'",   # X 를 눌러도 숨겨진 아이콘(^)으로 숨어 계속 돈다
  "pillow>=10; sys_platform == 'win32'",      # 아이콘 그림
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qtrader = "qtrader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qtrader*"]

[tool.setuptools.package-data]
qtrader = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
